<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IMHO · Propuesta de edición de video</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Syne:wght@500;600;700;800&display=swap">
<style>
/* Layout: una sola columna centrada, secciones amplias; identidad tomada de imho-web (crema, terracota, lima, celeste). */
:root {
  --cream: #EEEBE4;
  --beige: #F2DDD0;
  --lavender: #B8C3D9;
  --terracotta: #C4673A;
  --lime: #C8F04D;
  --dark: #0F0F0F;
  --muted: rgba(15, 15, 15, .56);
  --line: rgba(15, 15, 15, .1);
  --card: rgba(255, 255, 255, .5);
  --font-display: "Syne", "Arial Black", system-ui, sans-serif;
  --font-body: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --gutter-l: max(20px, env(safe-area-inset-left, 0px));
  --gutter-r: max(20px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--dark);
  background-color: var(--cream);
  background-image: linear-gradient(135deg, #EEEBE4 0%, #F2DDD0 25%, #B8C3D9 50%, #F2DDD0 75%, #EEEBE4 100%);
  background-size: 400% 400%;
  background-attachment: fixed;
  animation: gradientFlow 18s ease infinite;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
@keyframes gradientFlow {
  0% { background-position: 0% 50%; }
  33% { background-position: 100% 0%; }
  66% { background-position: 50% 100%; }
  100% { background-position: 0% 50%; }
}
::selection { background: var(--lime); color: var(--dark); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--terracotta); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }

/* ---------- Nav ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: rgba(238, 235, 228, .92); }
.nav { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 50; transition: background .3s, box-shadow .3s; }
.nav.scrolled { background: rgba(238, 235, 228, .92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 1px 0 var(--line); }
.nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 16px; }
.nav-logo { display: inline-flex; transition: opacity .2s; }
.nav-logo:hover { opacity: .65; }
.nav-logo svg { height: 26px; width: 77px; display: block; }
.nav-links { display: flex; align-items: center; gap: clamp(14px, 3vw, 34px); }
.nav-links a { text-decoration: none; font-size: 14px; font-weight: 500; color: var(--muted); transition: color .2s; }
.nav-links a:hover { color: var(--dark); }
.nav-links a.cta { background: var(--dark); color: var(--cream); padding: 10px 20px; border-radius: 999px; }
.nav-links a.cta:hover { background: #2a2a2a; }
@media (max-width: 520px) {
  .nav-logo svg { height: 20px; width: 59px; }
  .nav-links { gap: 14px; }
  .nav-links a { font-size: 13px; }
  .nav-links a.cta { padding: 8px 14px; }
}

/* ---------- Portada ---------- */
.hero { position: relative; overflow: hidden; min-height: min(100svh, 900px); display: flex; align-items: center; margin-top: calc(-1 * env(safe-area-inset-top, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + 110px); padding-bottom: 90px; }
.blob { position: absolute; pointer-events: none; border-radius: 50%; }
.blob-a { top: -10%; right: -10%; width: 70%; height: 80%; background: radial-gradient(ellipse at top right, var(--lavender) 0%, transparent 65%); filter: blur(70px); opacity: .55; animation: drift1 14s ease-in-out infinite; }
.blob-b { bottom: -10%; left: -10%; width: 50%; height: 60%; background: radial-gradient(ellipse at bottom left, var(--terracotta) 0%, transparent 65%); filter: blur(90px); opacity: .16; animation: drift2 18s ease-in-out 3s infinite; }
.blob-c { top: 30%; left: 40%; width: 30%; height: 35%; background: radial-gradient(ellipse, var(--lime) 0%, transparent 65%); filter: blur(80px); opacity: .18; animation: drift1 20s ease-in-out 1s infinite reverse; }
@keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(18px,-14px) scale(1.06); } 66% { transform: translate(-8px,8px) scale(.97); } }
@keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(-12px,18px) scale(1.1); } 66% { transform: translate(8px,-10px) scale(.93); } }
.hero .wrap { position: relative; width: 100%; }
.hero-inner { display: grid; gap: clamp(28px, 5vw, 48px); justify-items: start; }
.hero-logo svg { width: clamp(150px, 26vw, 260px); height: auto; display: block; }
.hero h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.3rem, 10.4vw, 7.6rem); line-height: .92; letter-spacing: -.035em; margin: 0; text-wrap: balance; max-width: 11ch; }
.hero h1 em { color: var(--terracotta); font-style: italic; }
.sparkle { position: absolute; color: var(--lime); pointer-events: none; }
.sparkle-1 { top: -8px; right: 4%; width: clamp(40px, 6vw, 64px); animation: spin 24s linear infinite; }
.sparkle-2 { bottom: -40px; right: 26%; width: 22px; color: var(--terracotta); opacity: .7; animation: spin 18s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.dot { position: absolute; top: 42%; right: 18%; width: 10px; height: 10px; background: var(--lime); border-radius: 50%; filter: blur(1px); animation: float 5s ease-in-out infinite; }
@keyframes float { 0%,100% { transform: translateY(0); opacity: .45; } 50% { transform: translateY(-22px); opacity: .9; } }
.scroll-hint { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; }
.scroll-hint span { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: rgba(15,15,15,.38); }
.scroll-hint i { width: 1px; height: 28px; background: rgba(15,15,15,.22); animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(8px); } }

/* Entrada de la portada */
.load { animation: rise .8s var(--ease) both; }
.load-1 { animation-delay: .1s; } .load-2 { animation-delay: .22s; }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }

/* ---------- Secciones ---------- */
section.block { padding-block: clamp(72px, 11vw, 140px); position: relative; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: var(--muted); border: 1px solid rgba(15,15,15,.2); border-radius: 999px; padding: 6px 14px; margin-bottom: 22px; }
.eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--lime); }
h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.1rem, 5.6vw, 4rem); line-height: .96; letter-spacing: -.03em; margin: 0; text-wrap: balance; }
h3.sub { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.7rem, 4vw, 2.6rem); line-height: 1; letter-spacing: -.025em; margin: 0; }

/* Qué incluye */
.incluye { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(32px, 6vw, 80px); align-items: start; }
.incluye-list { list-style: none; margin: 0; padding: 0; display: grid; }
.incluye-list li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 16px; padding-block: 20px; border-bottom: 1px solid var(--line); font-size: clamp(15px, 1.6vw, 17px); line-height: 1.6; }
.incluye-list li:first-child { padding-top: 4px; }
.incluye-list svg { width: 20px; height: 20px; color: var(--terracotta); margin-top: 3px; }
.aclaracion { margin-top: 24px; display: inline-flex; align-items: center; gap: 10px; background: var(--dark); color: var(--cream); border-radius: 999px; padding: 10px 18px; font-size: 13.5px; font-weight: 500; line-height: 1.4; }
.aclaracion b { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--lime); color: var(--dark); font-size: 12px; flex: none; }
@media (max-width: 820px) { .incluye { grid-template-columns: 1fr; } .aclaracion { border-radius: 18px; } }

/* Packs: tres tarjetas iguales lado a lado (según imagen de referencia) */
.packs-head { display: grid; justify-items: center; text-align: center; gap: 12px; margin-top: clamp(80px, 11vw, 130px); margin-bottom: clamp(32px, 4.5vw, 52px); }
.packs-head p { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
.packs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(14px, 2vw, 24px); }
.pack { display: flex; flex-direction: column; background: var(--card); border: 1px solid rgba(15,15,15,.14); border-radius: 28px; padding: clamp(26px, 3vw, 40px); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: transform .45s var(--ease), background .3s, box-shadow .45s var(--ease); }
.pack:hover { transform: translateY(-5px); background: rgba(255,255,255,.72); box-shadow: 0 22px 44px -26px rgba(15,15,15,.38); }
.pack-name { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.4rem, 2.3vw, 1.85rem); letter-spacing: -.02em; line-height: 1.1; margin: 0 0 10px; }
.pack-freq { margin: 0; font-size: 15px; line-height: 1.5; color: var(--muted); }
.pack hr { border: 0; border-top: 1px solid rgba(15,15,15,.14); margin: clamp(22px, 2.6vw, 30px) 0; width: 100%; }
.pack-total { display: grid; gap: 8px; margin-top: auto; container-type: inline-size; }
.pack-total small { font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.pack-total strong { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 12.5cqi, 3rem); letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pack-unit { margin: 0; font-size: 15px; color: var(--muted); }
.pack-unit b { color: var(--terracotta); font-weight: 600; }
@media (max-width: 860px) {
  .packs { grid-template-columns: minmax(0, 1fr); max-width: 460px; margin-inline: auto; }
  .pack { border-radius: 24px; }
}

/* Portfolio */
#portfolio .wrap > header { display: grid; gap: 0; justify-items: start; margin-bottom: clamp(32px, 5vw, 56px); }
.gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(14px, 2.4vw, 28px); max-width: 960px; }
.gallery.count-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: none; }
.reel { position: relative; aspect-ratio: 9 / 16; max-width: 100%; border-radius: 24px; overflow: hidden; background: var(--dark); box-shadow: 0 24px 50px -30px rgba(15,15,15,.55); transition: transform .5s var(--ease); }
.reel:hover { transform: translateY(-5px); }
.reel video { width: 100%; height: 100%; object-fit: cover; display: block; background: var(--dark); }
.reel.placeholder { display: grid; place-items: center; text-align: center; color: var(--dark); }
.reel.placeholder:nth-child(4n+1) { background: var(--lavender); }
.reel.placeholder:nth-child(4n+2) { background: var(--beige); }
.reel.placeholder:nth-child(4n+3) { background: var(--lime); }
.reel.placeholder:nth-child(4n+4) { background: var(--terracotta); color: #fff; }
.reel.placeholder .ph { display: grid; gap: 14px; justify-items: center; }
.reel.placeholder .play { width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid currentColor; display: grid; place-items: center; opacity: .75; }
.reel.placeholder .play svg { width: 18px; margin-left: 3px; }
.reel.placeholder span { font-family: var(--font-display); font-weight: 700; font-size: 15px; opacity: .55; }
.reel.placeholder .ghost { position: absolute; top: 14px; left: 18px; font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1; opacity: .08; }
@media (max-width: 980px) { .gallery.count-4 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 700px) {
  #portfolio .gallery-scroller { margin-left: calc(-1 * var(--gutter-l)); margin-right: calc(-1 * var(--gutter-r)); overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  #portfolio .gallery-scroller::-webkit-scrollbar { display: none; }
  .gallery, .gallery.count-4 { display: flex; gap: 14px; width: max-content; padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-bottom: 8px; }
  .reel { width: min(72vw, 300px); flex: none; scroll-snap-align: center; border-radius: 20px; }
  .swipe-hint { display: flex !important; }
}
.swipe-hint { display: none; align-items: center; gap: 8px; margin-top: 18px; font-size: 12px; color: var(--muted); }
.swipe-hint i { width: 26px; height: 1px; background: currentColor; }

/* Contacto */
#contacto { overflow: hidden; text-align: center; padding-block: clamp(96px, 14vw, 170px); }
#contacto .ghost-text { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; font-family: var(--font-display); font-weight: 800; font-size: 24vw; line-height: 1; color: rgba(15,15,15,.03); user-select: none; }
#contacto .wrap { position: relative; display: grid; justify-items: center; gap: 28px; }
#contacto .sparkle-c { width: 44px; color: var(--lime); animation: wiggle 4s ease-in-out infinite; }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 33% { transform: rotate(15deg); } 66% { transform: rotate(-15deg); } }
#contacto p.msg { margin: 0; max-width: 30ch; font-size: clamp(1.05rem, 2.2vw, 1.35rem); line-height: 1.5; color: var(--muted); text-align: center; text-wrap: balance; }
#contacto h2 { font-size: clamp(2.6rem, 8vw, 6rem); }
#contacto h2 em { color: var(--terracotta); font-style: italic; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; background: var(--dark); color: var(--cream); text-decoration: none; padding: 18px 34px; border-radius: 999px; font-size: 16px; font-weight: 500; transition: transform .35s var(--ease), background .2s; }
.btn:hover { transform: scale(1.04); background: #2a2a2a; }
.btn:active { transform: scale(.97); }
.btn svg { width: 18px; height: 18px; transition: transform .3s var(--ease); }
.btn:hover svg { transform: translateX(4px); }
@media (max-width: 520px) { .btn { width: 100%; } }

.foot { padding-block: 28px 36px; display: flex; justify-content: center; }
.foot svg { height: 18px; width: 53px; opacity: .35; }

/* Aparición al hacer scroll (sólo para lo que está fuera de pantalla al cargar) */
.reveal.pending { opacity: 0; transform: translateY(28px); }
.reveal.shown { opacity: 1; transform: none; transition: opacity .8s var(--ease), transform .8s var(--ease), background .3s, box-shadow .45s var(--ease); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .reveal.pending { opacity: 1; transform: none; }
}
</style>
</head>
<body>

</svg>

<nav class="nav" id="nav">
  <div class="wrap">
    <a class="nav-logo" href="#inicio" aria-label="IMHO, volver al inicio"><svg viewBox="0 0 460 155" fill="#0F0F0F" role="img" aria-label="IMHO"><use href="#imho-logo"/></svg></a>
    <div class="nav-links">
      <a href="#propuesta">Propuesta</a>
      <a href="#portfolio">Portfolio</a>
      <a href="#contacto" class="cta">Contacto</a>
    </div>
  </div>
</nav>

<main>
  <!-- 01 · PORTADA -->
  <header class="hero" id="inicio">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
    <div class="wrap">
      <svg class="sparkle sparkle-1" viewBox="0 0 24 24" aria-hidden="true"><use href="#sparkles"/></svg>
      <span class="dot" aria-hidden="true"></span>
      <div class="hero-inner">
        <div class="hero-logo load"><svg viewBox="0 0 460 155" fill="#0F0F0F" role="img" aria-label="IMHO"><use href="#imho-logo"/></svg></div>
        <h1 class="load load-1" id="hero-title"></h1>
      </div>
      <svg class="sparkle sparkle-2" viewBox="0 0 24 24" aria-hidden="true"><use href="#sparkles"/></svg>
    </div>
    <a class="scroll-hint" href="#propuesta" aria-label="Ir a la propuesta"><span>Scroll</span><i></i></a>
  </header>

  <!-- 02 · PROPUESTA -->
  <section class="block" id="propuesta">
    <div class="wrap">
      <div class="incluye">
        <div class="reveal">
          <span class="eyebrow">Propuesta</span>
          <h2 id="incluye-title"></h2>
        </div>
        <div class="reveal">
          <ul class="incluye-list" id="incluye-list"></ul>
          <div class="aclaracion" id="aclaracion"></div>
        </div>
      </div>

      <div class="packs-head reveal">
        <h2 id="packs-title"></h2>
        <p id="nota-moneda"></p>
      </div>
      <div class="packs" id="packs"></div>
    </div>
  </section>

  <!-- 03 · PORTFOLIO -->
  <section class="block" id="portfolio">
    <div class="wrap">
      <header class="reveal">
        <span class="eyebrow">Portfolio</span>
        <h2 id="portfolio-title"></h2>
      </header>
      <div class="gallery-scroller reveal"><div class="gallery" id="gallery"></div></div>
      <div class="swipe-hint" aria-hidden="true"><i></i>Deslizá para ver más</div>
    </div>
  </section>

  <!-- 04 · CONTACTO -->
  <section class="block" id="contacto">
    <div class="ghost-text" aria-hidden="true">IMHO</div>
    <div class="wrap reveal">
      <svg class="sparkle-c" viewBox="0 0 24 24" aria-hidden="true"><use href="#sparkles"/></svg>
      <p class="msg" id="contacto-msg"></p>
      <h2><em id="contacto-cierre"></em></h2>
      <a class="btn" id="contacto-btn" target="_blank" rel="noopener noreferrer" href="#"><span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
    </div>
  </section>
</main>

<footer class="foot"><svg viewBox="0 0 460 155" fill="#0F0F0F" role="img" aria-label="IMHO"><use href="#imho-logo"/></svg></footer>

<script src="config.js"></script>
<script>
(function () {
  var C = window.PROPUESTA;
  if (!C) return;
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  document.title = C.tituloPestana || document.title;

  // Portada
  var h1 = $("hero-title");
  h1.append(C.portada.titulo + " ");
  var em = el("em", null, C.portada.tituloDestacado);
  h1.append(em);

  // Propuesta
  var P = C.propuesta;
  $("incluye-title").textContent = P.titulo;
  var check = '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#sparkles"/></svg>';
  P.incluye.forEach(function (t) {
    var li = el("li"); li.innerHTML = check; li.append(el("span", null, t)); $("incluye-list").append(li);
  });
  var ac = $("aclaracion");
  if (P.aclaracion) { ac.append(el("b", null, "!")); ac.append(el("span", null, P.aclaracion)); } else ac.hidden = true;

  $("packs-title").textContent = P.tituloPacks;
  $("nota-moneda").textContent = P.notaMoneda || "";
  P.packs.forEach(function (p) {
    var card = el("article", "pack reveal");
    card.append(el("h4", "pack-name", p.nombre));
    card.append(el("p", "pack-freq", p.frecuencia));
    card.append(el("hr"));
    var tot = el("div", "pack-total");
    tot.append(el("small", null, P.etiquetaTotal));
    tot.append(el("strong", null, p.precioTotal));
    var unit = el("p", "pack-unit");
    var m = /^(\S+)(.*)$/.exec(p.precioUnitario);
    if (m) { unit.append(el("b", null, m[1])); unit.append(m[2]); } else unit.textContent = p.precioUnitario;
    tot.append(unit);
    card.append(tot);
    $("packs").append(card);
  });

  // Portfolio
  var V = C.portfolio;
  $("portfolio-title").textContent = V.titulo;
  var gallery = $("gallery");
  var videos = V.videos || [];
  if (videos.length === 4 || videos.length === 8) gallery.classList.add("count-4");

  function cloud(src) {
    // Se usa el archivo original: las versiones convertidas por Cloudinary pueden llegar recortadas.
    return src;
  }
  function cloudPoster(src) {
    if (src.indexOf("res.cloudinary.com") === -1 || src.indexOf("/video/upload/") === -1) return "";
    return src.replace("/video/upload/", "/video/upload/so_0,f_auto,q_auto,w_720/").replace(/\.(mov|mp4|m4v|webm)$/i, ".jpg");
  }

  videos.forEach(function (v, i) {
    var box = el("div", "reel");
    if (v.src) {
      var vid = document.createElement("video");
      vid.controls = true;
      vid.playsInline = true;
      vid.setAttribute("playsinline", "");
      vid.preload = "metadata";
      vid.setAttribute("controlsList", "nodownload");
      var poster = v.poster || cloudPoster(v.src);
      if (poster) vid.poster = poster;
      vid.src = cloud(v.src);
      vid.setAttribute("aria-label", "Video " + (i + 1) + " del portfolio");
      box.append(vid);
    } else {
      box.classList.add("placeholder");
      box.innerHTML = '<div class="ghost">IMHO</div><div class="ph"><div class="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></div><span>Video ' + (i + 1) + '</span></div>';
    }
    gallery.append(box);
  });
  // Un solo video a la vez
  gallery.addEventListener("play", function (e) {
    gallery.querySelectorAll("video").forEach(function (o) { if (o !== e.target) o.pause(); });
  }, true);

  // Contacto
  var K = C.contacto;
  $("contacto-msg").textContent = K.mensaje;
  $("contacto-cierre").textContent = K.cierre;
  var btn = $("contacto-btn");
  btn.querySelector("span").textContent = K.boton;
  btn.href = K.linkAlternativo || ("https://wa.me/" + K.whatsapp + "?text=" + encodeURIComponent(K.mensajeWhatsapp || ""));

  // Nav con fondo al scrollear
  var nav = $("nav");
  function onScroll() { nav.classList.toggle("scrolled", window.scrollY > 30); }
  window.addEventListener("scroll", onScroll, { passive: true }); onScroll();

  // Aparición suave sólo para lo que está debajo de la pantalla al cargar
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if ("IntersectionObserver" in window && !reduce) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.remove("pending"); en.target.classList.add("shown"); io.unobserve(en.target); }
      });
    }, { rootMargin: "0px 0px -8% 0px" });
    document.querySelectorAll(".reveal").forEach(function (n, i) {
      var r = n.getBoundingClientRect();
      if (r.top > window.innerHeight) { n.classList.add("pending"); io.observe(n); }
    });
    setTimeout(function () { document.querySelectorAll(".reveal.pending").forEach(function (n) { n.classList.remove("pending"); n.classList.add("shown"); }); }, 6000);
  }
})();
</script>
</body>
</html>
